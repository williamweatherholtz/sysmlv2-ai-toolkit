let SURFACES=[], UNSURFACED=[], activeVp=null;
let aiBridge=true; // serveSettings: whether the claude -p agent bridge is enabled (fetched from /api/settings)
function renderAgentEvent(data){
 try{const o=JSON.parse(data);
  if(o.type==='assistant'&&o.message&&o.message.content)return o.message.content.map(b=>b.type==='text'?b.text:(b.type==='tool_use'?`\n[tool: ${b.name}]`:'')).join('');
  if(o.type==='stream_event'&&o.event&&o.event.delta&&o.event.delta.text)return o.event.delta.text;
  if(o.type==='result')return `\n[result: ${o.subtype||''} ${o.total_cost_usd!=null?('$'+o.total_cost_usd):''}]\n`;
  return '';
 }catch(_){return ''}
}
let active=null, activeSurface=null, reportName="assurance", showAllReview=false;
const main=document.getElementById('main'), nav=document.getElementById('nav'), status=document.getElementById('status');
// CLICK DELEGATION AND SELF-DIAGNOSIS (issue152). Registered HERE, immediately after the element
// handles and before anything that can throw, and bound to DOCUMENT rather than to `main`:
//   - bound late, any earlier top-level error would leave no listener at all, which is indistinguishable
//     from "clicking does nothing" — the exact report received three times;
//   - bound to `main`, a captured node that was ever replaced would take its listener with it.
// It also REPORTS what it saw on every click, because three rounds of source-reading could not tell me
// whether the handler was firing, whether the attribute was in the DOM, or whether the navigation ran.
// A page the reader can interrogate beats a page I have to reason about.
document.addEventListener('click',e=>{
 // A panel switch travels the same way a card target does, so a bridge rendered anywhere works with no
 // per-render wiring and cannot be orphaned by a re-render (issue154).
 const p=e.target&&e.target.closest?e.target.closest('[data-panel]'):null;
 if(p){activeSurface=null;activeVp=null;active=p.dataset.panel;location.hash=p.dataset.panel;draw();render();return}
 const t=e.target&&e.target.closest?e.target.closest('[data-oblig],[data-vp]'):null;
 if(!t){
  // Only speak up when the click looks like an attempt to act, so ordinary clicks stay quiet.

   const n=document.querySelectorAll('[data-oblig],[data-vp]').length;
   status.textContent='that card carries no target ('+n+' targeted card(s) on this page) — click-to-act is bound by identity, so a card without data-oblig/data-vp has nothing to open';
  }

 }
 status.textContent='opening '+(t.dataset.oblig||t.dataset.vp)+'…';
 goToVp(t.dataset.oblig||t.dataset.vp);
});
// The command a viewpoint's DECLARED renderer names — the binding comes from the model, so a
// viewpoint pointing at an existing panel gets it, and one that does not says what to run instead.
// ACT BRIDGE (issue154). "Click to act" navigated correctly for three reports and landed on views where
// nothing could be done: acceptances went to the orient panel (counts), authority-queue and
// sitting-coverage to a read-only JSON rendering. Navigation was never the defect - the DESTINATION was.
// So a panel holding work it cannot discharge now says so and offers the panel that can.
//
// Keyed on the PAYLOAD's shape, not on a list of viewpoint names: any computed view returning items that
// await a human acceptance gets the bridge, including one declared after this was written.
function acceptanceItems(d){
 if(!d||typeof d!=='object')return 0;
 const aw=Array.isArray(d.awaiting)?d.awaiting:[];
 const pa=Array.isArray(d.pendingAcceptances)?d.pendingAcceptances:[];
 return aw.filter(x=>/accept|confirm/i.test(String(x&&x.kind||''))).length+pa.length;
}
function actBridge(n){

 return '<p class=muted style="border-left:3px solid #b58900;padding-left:8px">This panel RENDERS the '
  +'computed view and cannot discharge it. Nothing here is a control. To act: use the review queue where '
  +'the item is acceptance-bearing, or run <code>keel '+esc(cmd)+'</code> and record the result.</p>';
}
function vpCmd(vp){return String(vp&&vp.renderer||'').replace(/^keel\s+/,'').split(/[\s(]/)[0]}
// WHAT AWAITS THE HUMAN, per viewpoint (issue288). Filled by buildNav from /api/obligations, which
// derives its classes from viewpoints declaring surface="act" — so declaring one adds a class with no
// console change. `countable:false` means the class has NO bound counter and must NEVER render as 0.
let OBL={};
function oblOf(vp){return OBL[vp]||null}
/// The flag a surface or viewpoint carries: how many items are waiting on the HUMAN there.
function oblFlag(vps){
 let n=0,unknown=0;
 (vps||[]).forEach(v=>{const o=oblOf(v.viewpoint||v);if(!o)return;if(o.countable)n+=o.count||0;else unknown++});
 if(n>0)return '<span class=oblflag title="items waiting on YOU here">'+n+'</span>'
   +(unknown?'<span class=oblunk title="'+unknown+' class(es) here have no bound counter — NOT zero, unknown">+?</span>':'');
 if(unknown)return '<span class=oblunk title="'+unknown+' class(es) here have no bound counter — NOT zero, unknown">?</span>';
 return '';
}
async function buildNav(){

 // A FAILED obligations fetch must not read as "nothing waiting": the flags say `?` instead of
 // vanishing, because an absent flag means zero and that would be a false all-clear.
 OBL={};let oblFailed=false;
 try{const o=await get('/api/obligations');(o.classes||[]).forEach(c=>{OBL[c.viewpoint]={count:c.count,countable:c.countable!==false}})}
 catch(e){oblFailed=true}
 nav.innerHTML='';
 SURFACES.forEach(s=>{const b=document.createElement('button');
  // THE TAB SAYS WHAT NEEDS YOU, not how many viewpoints exist (issue288). The viewpoint count was

  b.innerHTML=esc(s.surface)+(flag?' '+flag:'');
  b.title=s.surface+' — '+(s.count||0)+' viewpoint(s)'+(flag?'; the badge counts items waiting on YOU':'; nothing here is waiting on you');
  b.dataset.k=s.surface;

  nav.appendChild(b)});
 if(UNSURFACED.length){const b=document.createElement('button');
  const uflag=oblFlag(UNSURFACED);
  b.innerHTML='unsurfaced'+(uflag?' '+uflag:'');b.dataset.k='__unsurfaced';

 const g=document.createElement('button');g.textContent='⚙';g.dataset.k='settings';
 g.title='console settings — app configuration, not a lens on the model, so not a surface';
 g.onclick=()=>{activeSurface=null;activeVp=null;active='settings';location.hash='settings';draw();render()};
 nav.appendChild(g);
 const h=location.hash.slice(1);
 activeSurface=SURFACES.some(s=>s.surface===h)?h:(SURFACES[0]&&SURFACES[0].surface)||null;
 if(h==='settings'){active='settings';activeSurface=null}

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

async function get(u){const r=await fetch(u);let j=null;try{j=await r.json()}catch(_){}
 if(!r.ok){const e=new Error((j&&(j.reason||j.viewStatus))||('HTTP '+r.status));e.viewStatus=(j&&j.viewStatus)||'failed';throw e}

// A view's own status decides how it is drawn. An empty COMPUTED view says so; a STALE one says
// when it was last true; a FAILED one says why. None of them renders as the others (N-C2).
function statusBanner(d){
 const s=d&&d.viewStatus;
 if(s==='stale')return '<p class=muted style="border-left:3px solid #b58900;padding-left:8px">STALE — this could not be recomputed and is the last value known to be true. Reason: '+esc(d.staleReason||'unknown')+'</p>';

function list(arr,n){arr=arr||[];if(!arr.length)return '<span class=muted>—</span>';const s=arr.slice(0,n||8).join(', ');return esc(s)+(arr.length>(n||8)?` <span class=muted>…+${arr.length-(n||8)} more</span>`:'')}
// DEVICE-BOUND TAPS (D0201 OPTION B, the human's choice of 2026-08-23). This browser generates a device
// key once (localStorage) and pairs it by typing the PAIRING CODE the keel serve terminal printed; every
// human tap is then signed with HMAC-SHA256 over its canonical content and the server refuses a tap with
// no paired device or a wrong signature, writing nothing. This binds a tap to the DEVICE, not to a
// person's identity - the trust that the paired browser is the human's rests on the code reaching them
// through the serving terminal.
var DEV_KEY='keel.device.key',DEV_ID='keel.device.id',DEV_PAIRED='keel.device.paired';
function devHex(a){return Array.from(a).map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
function devId(){var id=localStorage.getItem(DEV_ID);if(!id){var b=new Uint8Array(6);crypto.getRandomValues(b);id='browser-'+devHex(b);localStorage.setItem(DEV_ID,id);}return id;}
function devKeyHex(){var k=localStorage.getItem(DEV_KEY);if(!k){var b=new Uint8Array(32);crypto.getRandomValues(b);k=devHex(b);localStorage.setItem(DEV_KEY,k);}return k;}
function devBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
async function devSign(kind,target,at,by,note){
  if(!(await devEnsure(by)))throw new Error('this browser is not paired - nothing was sent (D0201 B)');
  var key=await crypto.subtle.importKey('raw',devBytes(devKeyHex()),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  var sig=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(kind+'|'+target+'|'+at+'|'+by+'|'+(note||'')));
  return {device_id:devId(),hmac:devHex(new Uint8Array(sig))};}
async function devPair(code,label){
  var r=await fetch('/api/device/enroll',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:code,device_id:devId(),key:devKeyHex(),label:label||''})});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  localStorage.setItem(DEV_PAIRED,'1');return j;}
async function devEnsure(by){
  if(localStorage.getItem(DEV_PAIRED))return true;
  var code=prompt('Pair this browser (D0201 B): type the PAIRING CODE printed by the keel serve terminal');
  if(!code)return false;
  await devPair(code.trim(),by||'');return true;}
function TODAY(){return new Date().toISOString().slice(0,10);}
function itemLink(name){return name?`<span class=il data-i="${esc(name)}">${esc(name)}</span>`:'<span class=muted>—</span>'}
function linkList(arr,n){arr=arr||[];if(!arr.length)return '<span class=muted>—</span>';n=n||12;const sh=arr.slice(0,n).map(itemLink).join(' · ');return sh+(arr.length>n?` <span class=muted>…+${arr.length-n} more</span>`:'')}

// GENERIC COMPUTED-VIEW RENDERER (issue286). Every viewpoint without a bespoke panel used to render as
// `<pre>JSON.stringify(d)</pre>` — a vanilla payload the reader has to parse by eye, with item names as
// dead text even though `itemLink`/`openItem`/`/api/item/:name` have existed all along. So the console
// had a working navigation mechanism and the generic panel simply did not use it.
//
// Item names are LINKED DYNAMICALLY: anything shaped like a keel item name becomes clickable, and
// `openItem` resolves it against the live model at click time — so a view gains working links with no
// per-view code, and a name that is not an item simply opens a panel saying so.
const ITEM_RE=/^(issue\d{3,}|d\d{4}|sprint\d+|us\d{3,}|st\d{3,}|obligation[0-9a-f]+|[a-z][A-Za-z0-9]*(Story|Gate|DoD|Accept|R\d+)|dc[A-Z][A-Za-z0-9]*|sr[A-Z][A-Za-z0-9]*)$/;
function looksLikeItem(v){return typeof v==='string'&&v.length<64&&ITEM_RE.test(v)}
function cell(v){
 if(v===null||v===undefined||v==='')return '<span class=muted>—</span>';
 if(Array.isArray(v))return v.length?v.map(cell).join(' · '):'<span class=muted>—</span>';
 if(typeof v==='object')return '<code style="font-size:10px">'+esc(JSON.stringify(v))+'</code>';
 if(looksLikeItem(v))return itemLink(v);
 if(typeof v==='boolean')return v?'yes':'no';

 // Long prose stays readable rather than blowing the column out; the full text is in the title.

}

  +'<thead><tr>'+cols.map(c=>'<th style="text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid #2a3542;color:var(--mut);text-transform:uppercase;font-size:10px">'+esc(c)+'</th>').join('')+'</tr></thead>'
  +'<tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td style="padding:3px 8px 3px 0;border-bottom:1px solid #1b2530;vertical-align:top">'+cell(r&&r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';

 let out='',scalars=[];

   out+='<h3 style="font-size:11px;color:var(--mut);text-transform:uppercase;margin:12px 0 4px">'+esc(k)+' ('+v.length+')</h3>'+renderRows(v);
  } else if(Array.isArray(v)){
   out+='<h3 style="font-size:11px;color:var(--mut);text-transform:uppercase;margin:12px 0 4px">'+esc(k)+' ('+v.length+')</h3>'

   out+='<h3 style="font-size:11px;color:var(--mut);text-transform:uppercase;margin:12px 0 4px">'+esc(k)+'</h3>'+renderRows([v]);

 });

async function runAgentModal(action,target,section,boundary){
 stopModalAgent();const l=document.getElementById('mlog');if(l){l.style.display='block';l.textContent=`=== ${action}: ${boundary?('black-box '+boundary):target}${section?(' @ '+section):''} ===\n`}
 // srServeApproveGate (D0109): fetch + show the PLAN, require explicit approval, THEN execute (approved=true).
 let q='action='+encodeURIComponent(action)+'&target='+encodeURIComponent(target||'');
 if(section)q+='&section='+encodeURIComponent(section); // sr18: section-scoped critique
 if(boundary)q+='&boundary='+encodeURIComponent(boundary); // sr19: black-box interface critique
 let plan;
 try{const r=await fetch('/api/agent/plan?'+q);plan=await r.json()}catch(e){mlog('[error] could not fetch plan: '+e.message+'\n');return}
 mlog('PLAN — review before approving (srServeApproveGate):\n  action: '+plan.action+'\n  target: '+plan.target+'\n  executable: '+plan.executable+'\n\n  prompt:\n  '+String(plan.prompt||'').replace(/\n/g,'\n  ')+'\n\n');
 if(!plan.executable){mlog('[blocked] not executable — a non-declared launchable / unsupported action. See the Launch tab / `keel launchables`.\n');return}
 if(!confirm('Approve + run this '+plan.action+'?\n\n'+plan.prompt)){mlog('[cancelled] not approved — nothing ran.\n');return}
 // srServeApproveGateHuman: the approval is the named human's attestation, bound to the exact
 // reviewed plan (planHash) — a cancelled name prompt approves nothing.
 const approver=judgedBy();if(!approver){mlog('[cancelled] no approver named — nothing ran.\n');return}
 mes=new EventSource('/api/agent/stream?'+q+'&approved=true&approved_by='+encodeURIComponent(approver)+'&plan_hash='+encodeURIComponent(plan.planHash||''));
 mes.addEventListener('status',e=>mlog('· '+e.data+'\n\n'));
 mes.addEventListener('agent',e=>{const t=renderAgentEvent(e.data);if(t)mlog(t)});
 mes.addEventListener('done',e=>{mlog('\n\n'+e.data+'\n');stopModalAgent()});
 mes.addEventListener('error',e=>{if(e.data)mlog('\n[error] '+e.data+'\n')});
}

   const ucs=(b.useCases||[]).map(x=>`<div class=row><div class=t>${itemLink(x.name)} ${esc(x.title||'')}</div></div>`).join('');
   main.innerHTML='<p class=muted>'+esc(b.business||'')+'</p>'
     +'<h3>Brief</h3>'+(brief||'<span class=muted>none</span>')
     +'<h3>Needs</h3>'+(needs||'<span class=muted>none</span>')
     +'<h3>Personas</h3>'+(pers||'<span class=muted>none</span>')
     +(ucs?'<h3>Use cases</h3>'+ucs:'');
  } else if(active==='decisions'){const d=await get('/api/decisions');
   // sr15: decisions newest-first (dNNNN is sequential ~ chronological); the score order stays as a tiebreak from the API.
   const arr=(d.decisions||[]).slice().sort((a,b)=>String(b.decision||b.name||'').localeCompare(String(a.decision||a.name||'')));
   main.innerHTML='<p class=muted>'+esc(d.report||'')+' · newest-first</p>'+arr.map(x=>`<div class=row><div class=t>${itemLink(x.id||x.decision||x.name)} ${esc(x.title||'')}</div><div class=m>${esc([x.uncritiqued?'uncritiqued':'',x.references_retired?'references-retired':'',x.superseded_in_part?'superseded-in-part?':''].filter(Boolean).join(' · '))}</div></div>`).join('')||'<span class=muted>no decisions</span>';
  } else if(active==='processes'){const p=await get('/api/processes');
   main.innerHTML=(p.processes||[]).map(x=>`<div class=row><div class=t>${x.name?itemLink(x.name):esc(x.file)} <span class=muted>${esc(x.title||'')}</span></div><div class=m>${esc(x.file)} — ${esc(x.purpose)}</div></div>`).join('')||'<span class=muted>none</span>';
  } else if(active==='section'){
   const seedParam=secKind+':'+secSeed;
   let body='<div class=row><div class=t>Bounded section — local render + section-scoped critique</div>'+
    '<div class=m>Render a declared <b>view</b>, or an <b>element</b> with its 1-hop typed-edge neighbourhood. Whole-model views are too coarse for local "does X make sense here" critique (sr18) — critique runs scoped to this section.</div>'+
    '<div style="margin-top:8px">'+
     '<select id=secKind><option value=element'+(secKind==='element'?' selected':'')+'>element + neighbourhood</option><option value=view'+(secKind==='view'?' selected':'')+'>declared view</option></select> '+
     '<input id=secSeed placeholder="element or view name" value="'+esc(secSeed)+'" style="padding:4px 7px;border:1px solid var(--bd);border-radius:5px;min-width:240px"> '+
     '<button class=rb id=secGo>Render section ▶</button>'+
    '</div></div>';
   if(secData&&secData.error){body+='<p class=muted style="color:var(--bad)">'+esc(secData.error)+'</p>';}
   else if(secData){
    body+='<p class=muted>section <b>'+esc(secData.seed)+'</b> <span class=pill>'+esc(secData.kind)+'</span> · '+secData.count+' element(s) · '+(secData.edges||[]).length+' edge(s)</p>'+
     (secData.items||[]).map(it=>`<div class=row><div class=t>${itemLink(it.name)} <span class=pill>${esc(it.type)}</span>${it.marker?' <span class=pill>#'+esc(it.marker)+'</span>':''}</div>${it.title?'<div class=m>'+esc(it.title)+'</div>':''}${aiBridge?`<div style="margin-top:5px"><button class=rb data-sc="${esc(it.name)}">Critique in section ▶</button></div>`:''}</div>`).join('');
    if((secData.edges||[]).length)body+='<h3 style="font-size:11px;color:var(--mut);text-transform:uppercase;margin:11px 0 3px">Edges ('+secData.edges.length+')</h3>'+secData.edges.map(e=>`<div style="font-size:11px;margin:2px 0">${itemLink(e.from)} <span class=pill>${esc(e.kind)}</span> ${itemLink(e.to)}</div>`).join('');
   } else {body+='<p class=muted>Enter a name and press <b>Render section ▶</b>.</p>';}
   main.innerHTML=body;
   document.getElementById('secGo').onclick=loadSection;
   document.getElementById('secSeed').addEventListener('keydown',ev=>{if(ev.key==='Enter')loadSection()});
   [...main.querySelectorAll('.rb[data-sc]')].forEach(b=>b.onclick=()=>openSectionCritique(b.dataset.sc,seedParam));
  } else if(active==='boundary'){
   const sweep=await get('/api/boundary-sweep').catch(()=>({rows:[]}));
   let body='<div class=row><div class=t>White-box / black-box boundary critique (sr19)</div>'+
    '<div class=m>A <b>Need-slice</b> = a Need + its SRs + allocated Components + verifying Tests (a recursive System-of-Interest). <b>White-box</b> = critique its internal elements; <b>black-box</b> = critique its interfaces (cut edges). Boundaries come from the model’s structure, not clustering (D0100).</div>'+
    '<div style="margin-top:8px"><input id=bndNeed placeholder="Need name (e.g. n17ServeGranularWhitebox)" value="'+esc(bndNeed)+'" style="padding:4px 7px;border:1px solid var(--bd);border-radius:5px;min-width:300px"> <button class=rb id=bndGo>Render boundary ▶</button></div></div>';
   if(bndData&&bndData.error){body+='<p class=muted style="color:var(--bad)">'+esc(bndData.error)+'</p>';}
   else if(bndData){
    body+='<p class=muted>boundary <b>'+esc(bndData.need)+'</b> · '+bndData.internal_count+' internal element(s) · coupling '+bndData.coupling+' interface(s)'+(aiBridge?' &nbsp; <button class=rb id=bndBB>Black-box critique (interfaces) ▶</button>':'')+'</p>'+
     '<h3 style="font-size:11px;color:var(--mut);text-transform:uppercase;margin:8px 0 3px">White-box · internal elements</h3>'+
     (bndData.internal||[]).map(it=>`<div class=row><div class=t>${itemLink(it.name)} <span class=pill>${esc(it.type)}</span></div>${it.title?'<div class=m>'+esc(it.title)+'</div>':''}${aiBridge?`<div style="margin-top:5px"><button class=rb data-wb="${esc(it.name)}">Critique element ▶</button></div>`:''}</div>`).join('')+
     '<h3 style="font-size:11px;color:var(--mut);text-transform:uppercase;margin:11px 0 3px">Black-box · interfaces (cut edges)</h3>'+
     ((bndData.interfaces||[]).length?bndData.interfaces.map(e=>`<div style="font-size:11px;margin:2px 0">${itemLink(e.internal)} <span class=pill>${esc(e.kind)}</span> ${itemLink(e.external)} <span class=muted>(external: ${esc(e.external)})</span></div>`).join(''):'<span class=muted>no interfaces — fully self-contained</span>');
   } else {body+='<p class=muted>Enter a Need and press <b>Render boundary ▶</b>.</p>';}
   // the tier-satisfaction sweep table
   body+='<h3 style="font-size:11px;color:var(--mut);text-transform:uppercase;margin:14px 0 3px">Tier-satisfaction sweep · per Need-slice</h3>'+
    '<table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="text-align:left;color:var(--mut)"><th>Need</th><th>internal</th><th>coupling</th><th>SRs</th><th>decomposed</th><th>SRs verified</th></tr>'+
    (sweep.rows||[]).map(r=>`<tr><td>${itemLink(r.need)}</td><td>${r.internal_count}</td><td>${r.coupling}</td><td>${r.sr_count}</td><td>${r.decomposed?'✓':'<span style="color:var(--bad)">✗</span>'}</td><td>${r.srs_verified?'✓':'<span style="color:var(--warn)">✗</span>'}</td></tr>`).join('')+'</table>';
   main.innerHTML=body;
   document.getElementById('bndGo').onclick=loadBoundary;
   document.getElementById('bndNeed').addEventListener('keydown',ev=>{if(ev.key==='Enter')loadBoundary()});
   if(bndData&&!bndData.error&&aiBridge){const bb=document.getElementById('bndBB');if(bb)bb.onclick=()=>openBoundaryCritique(bndData.need);}
   [...main.querySelectorAll('.rb[data-wb]')].forEach(b=>b.onclick=()=>openSectionCritique(b.dataset.wb,'element:'+b.dataset.wb));
  } else if(active==='dispositions'){const d=await get('/api/dispositions');
   main.innerHTML='<div class=cards>'+card('≥Medium findings',d.ge_medium_findings,'total','')+card('Dispositioned',d.dispositioned,'have a typed verdict','good')+card('Undispositioned',d.undispositioned,'awaiting a verdict',d.undispositioned?'warn':'good')+'</div>'+
    '<p class=muted>Disposition a finding — your click + rationale is your explicit verdict (recorded via the write API; not committed).</p>'+
    (d.findings||[]).map(f=>`<div class=row><div class=t>${itemLink(f.finding)} <span class=pill>${esc(f.severity)}</span> <span class=pill>${esc(f.disposition)}</span></div><div style="margin-top:5px"><button class=rb data-f="${esc(f.finding)}" data-v="act">Act</button><button class=rb data-f="${esc(f.finding)}" data-v="accept-risk">Accept-risk</button><button class=rb data-f="${esc(f.finding)}" data-v="dismiss">Dismiss</button></div></div>`).join('');
   [...main.querySelectorAll('.rb[data-v]')].forEach(b=>b.onclick=()=>disposition(b.dataset.f,b.dataset.v));
  } else if(active==='reports'){
   const names=['assurance','traceability','quality-debt','flow','governance'];
   const r=await get('/api/report/'+reportName);
   main.innerHTML='<div>'+names.map(n=>`<button class=rb data-r="${n}" ${n===reportName?'style="border-color:var(--ac);font-weight:600"':''}>${n}</button>`).join('')+'</div>'+
    '<p class=muted><a href="/view/report/'+reportName+'" target=_blank>Open full HTML report ↗</a> &nbsp;·&nbsp; <a href="/view/diagram" target=_blank>Open model diagram ↗</a></p>'+
    '<h3 style="margin:6px 0">'+esc(r.title||reportName)+'</h3><div class=cards>'+(r.cards||[]).map(c=>card(c.label,c.value,esc(c.detail),c.tone)).join('')+'</div>';
   [...main.querySelectorAll('.rb[data-r]')].forEach(b=>b.onclick=()=>{reportName=b.dataset.r;render()});
  } else if(active==='settings'){const s=await get('/api/settings');aiBridge=!!s.agentBridge;
   main.innerHTML='<div class=row><div class=t><label><input type=checkbox id=abtog '+(aiBridge?'checked':'')+'> Enable AI agent bridge (in-console Critique)</label></div>'+
    '<div class=m>Drives your local <code>claude -p</code> (headless). Auth = your subscription/enterprise login; never sets ANTHROPIC_API_KEY. CAVEAT (D0094): <code>claude -p</code> headless billing has been in flux and may bill as API — turn OFF if you want to avoid that. When OFF, the console is read/oversight-only and AI critique runs in your own Claude Code session. Persists to .keel-serve.json.</div></div>';
   document.getElementById('abtog').onchange=async e=>{const v=e.target.checked;try{const r=await fetch('/api/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agentBridge:v})});const j=await r.json();aiBridge=!!j.agentBridge;status.textContent='settings saved (agent bridge '+(aiBridge?'ON':'OFF')+')'}catch(err){status.textContent='settings error: '+err.message}};
  } else if(active==='history'){const h=await get('/api/history');
   if(!h.available){main.innerHTML='<p class=muted>'+esc(h.note||'no transcripts found')+'</p>';}
   else{main.innerHTML='<p class=muted>'+(h.sessions||[]).length+' session(s) · showing latest ('+esc(h.current_id)+'). Source: '+esc(h.dir)+' (read-only lens; never copied into the model).</p>'+
    (h.current||[]).map(t=>`<div class="turn ${esc(t.role)}"><div class=who>${esc(t.role)}</div>${esc(t.text)}</div>`).join('')||'<span class=muted>empty</span>';}
  } else if(activeVp){
   // GENERIC VIEWPOINT PANEL. A card must land on the view its renderer names even when no bespoke panel
   // exists — otherwise clicking an obligation changes nothing and the reader concludes the card is dead.
   // Rendered from /api/computed/:cmd, so a NEWLY DECLARED act viewpoint is reachable with no console
   // change; where a bespoke panel exists (orient, dispositions) the branches above take it first and the
   // reader gets the ACT controls rather than this read-only rendering.
   const cmd=vpCmd(activeVp);
   let d=null,failed=null;
   try{d=await get('/api/computed/'+encodeURIComponent(cmd))}catch(e){failed=e.message}
   main.innerHTML=obl+'<h2>'+esc(activeVp.title||cmd)+'</h2>'+
    '<p class=muted>'+esc(activeVp.concern||'')+'<br>renderer <code>'+esc(activeVp.renderer||'')+'</code></p>'+
    (failed
      ? '<p class=muted style="border-left:3px solid #c33;padding-left:8px">this view could not be computed: '+esc(failed)+' — it is NOT empty. Run <code>keel '+esc(cmd)+'</code> on the CLI.</p>'
      : statusBanner(d)+actBridge(acceptanceItems(d))+readOnlyNote(cmd)
        +renderComputed(d)
        // The payload stays available, collapsed: a rendered table is a READING of the data, and the
        // reader must be able to check it against what the server actually sent (issue286).
        +'<details style="margin-top:14px"><summary class=muted style="cursor:pointer;font-size:11px">raw payload</summary>'
        +'<pre class=j>'+esc(JSON.stringify(d,null,1))+'</pre></details>');
   status.textContent=(activeVp.title||cmd)+(failed?' — failed':'');return;
  }
  status.textContent='live · updated '+new Date().toLocaleTimeString();
 }catch(e){
  // issue143: a thrown render used to leave the PREVIOUS panel on screen and change only the status line,
  // which is exactly how a failure disguises itself as "nothing happened". The panel now says so.
  status.textContent='error: '+e.message;
  main.innerHTML='<p class=muted style="border-left:3px solid #c33;padding-left:8px">this view FAILED to render: '
   +esc(e.message)+' &mdash; the panel below is not stale, there is nothing to show. '
   +'active=<code>'+esc(String(active))+'</code> surface=<code>'+esc(String(activeSurface))+'</code>'
   +' viewpoint=<code>'+esc(String(activeVp&&(activeVp.viewpoint||activeVp.title)))+'</code></p>';
 }
}
// Card navigation, bound ONCE by DELEGATION on the container rather than per-render on each element.
// Two reasons, both learned the hard way: a per-render positional binding was off by the number of
// obligation cards (they share `.c` and land in the same container), and a future render path that
// forgets to re-attach a handler would silently produce dead cards. Delegation keyed on a data-*
// attribute cannot go off-by-N and cannot be forgotten (srConsoleObligationActionable).
function findVp(name){
 for(const s of SURFACES){const v=(s.viewpoints||[]).find(v=>v.viewpoint===name||v.title===name);if(v)return[s.surface,v]}
 const u=UNSURFACED.find(v=>v.viewpoint===name||v.title===name);
 return u?['__unsurfaced',u]:[null,null];
}
// Go to the place the work is done: select the viewpoint AND the surface that holds it, so the nav
// highlight agrees with what is rendered — arriving at a view while the nav points elsewhere is its own
// small lie about where you are.
function goToVp(name){
 // Announce the attempt FIRST: everything after this point can await and throw, and a click whose only
 // evidence is the panel changing cannot be distinguished from a click that never fired (issue143).
 status.textContent='going to '+name+'…';
 const [surface,vp]=findVp(name);
 if(!vp){status.textContent='no declared viewpoint named '+name+' — the card names a target the model does not declare';return}
 activeSurface=surface;activeVp=vp;active=vpCmd(vp);
 if(surface)location.hash=surface;
 draw();render();
}

// load the agent-bridge setting up front so Critique buttons reflect it (serveSettings), then draw
// buildNav() MUST resolve before the first render: navigation comes from the model now, so there is
// nothing to draw until /api/surfaces answers. A failure here is reported rather than rendered as an
// empty nav, because an empty surface list and a failed fetch must not look alike (N-C2).
// Stamp WHICH build this page is: a console is client-side JavaScript, so a browser holding an older copy
// runs older logic against a newer API and nothing server-side can see the mismatch (issue143).
fetch('/api/version').then(r=>r.json()).then(v=>{
  document.getElementById('build').textContent=' · api '+v.apiVersion+' · page loaded '+new Date().toLocaleTimeString();
}).catch(()=>{});
// WHICH PROJECT, and switch it (issue268). /api/projects and POST /api/project have existed since
// N-C4 and NOTHING rendered them — a capability with no surface. The badge is substituted
// server-side so it is right on first paint; this only fills the switcher, and if the fetch fails
// the badge still names the project rather than the console going quiet about it.
fetch('/api/projects').then(r=>r.json()).then(p=>{
  var sel=document.getElementById('projsel'); if(!sel||!p.projects) return;
  if(p.projects.length<2){ sel.style.display='none'; return; }   // nothing to switch between
  sel.innerHTML=p.projects.map(function(x){
    return '<option value="'+x.root.replace(/"/g,'&quot;')+'"'+(x.active?' selected':'')+'>'+x.name+'</option>';
  }).join('');
  sel.onchange=function(){
    // A rebind changes where every WRITE lands, so it reloads rather than repainting: a stale view
    // beside a switched root is exactly the confusion this whole change exists to remove.
    fetch('/api/project',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({root:sel.value})})
      .then(function(r){ if(!r.ok) return r.text().then(function(t){throw new Error(t)}); location.reload(); })
      .catch(function(e){ status.textContent='project switch REFUSED: '+e.message+' — still serving '+document.getElementById('proj').textContent; });
  };
}).catch(()=>{});
fetch('/api/settings').then(r=>r.json()).then(s=>{aiBridge=!!s.agentBridge}).catch(()=>{})
 .then(()=>buildNav())
 .then(()=>render())
 .catch(e=>{status.textContent='navigation could not be computed: '+e.message+' — this is a FAILURE, not an empty console';});
// pre-load the light views to warm the server-side cache so tab-switches are instant
['orient','decisions','dispositions','processes'].forEach(k=>fetch('/api/'+k).catch(()=>{}));
// event-driven refresh: the server pushes `changed` only when the model's content fingerprint flips
const MY_BUILD='__KEEL_BUILD__';
// A tab open across a server restart keeps running the build it loaded with, forever, while looking
// current because the SSE stream and the 30s interval keep repainting it (issue153). Compare builds and
// reload rather than let the reader debug logic that no longer exists on disk.
async function reloadIfStale(){
 try{
  const v=await (await fetch('/api/version',{cache:'no-store'})).json();
  if(v.consoleBuild&&v.consoleBuild!==MY_BUILD){
   status.textContent='this page is build '+MY_BUILD+' and the server now serves '+v.consoleBuild+' — reloading';
   location.reload();
  }
 }catch(e){/* offline: keep what we have rather than reload-loop */}
}
let evs=new EventSource('/api/events');
evs.addEventListener('hello',()=>{status.textContent='live (event-driven)';reloadIfStale()});
evs.addEventListener('changed',()=>render());
evs.onerror=()=>{status.textContent='live: reconnecting…'};
// slow safety-net refresh in case the event stream drops (NOT the primary path)
setInterval(render,30000);
setInterval(reloadIfStale,30000);
// LAST STATEMENT IN THE FILE (issue152): if the header does not say `js ok`, the script threw before
// here and every listener registered after the throw is missing. That single word tells the reader
// whether the page is alive, which no amount of reading the source from outside can establish.
(function(){
 const b=document.getElementById('build');
 if(b)b.textContent=' · js ok · '+document.querySelectorAll('[data-oblig],[data-vp]').length+' clickable card(s)'+b.textContent;
})();
</script></body></html>
