# CI gate (issue042 / n14TddBdd): enforce `cargo test` + `cargo clippy -D warnings` green on every
# push and PR to main. This is the automated test-gate the critique campaign found MISSING — the
# .githooks pre-commit hook runs clippy + keel validate/guard but NOT cargo test, and there was no CI,
# so a failing test could reach main (issue042). A CI job (vs the pre-commit hook) keeps the ~15s test
# run off the per-commit path (n11/D0054 friction). Rust gates only — the KERNEL (JVM) validators still
# stay in the pre-commit hook (they need the local conda kernel). But the kernel-FREE keel gates
# (validate/guard/check-engine) run here too as a SKIP_VALIDATE-proof backstop (issue067/D0112 phase 2):
# a commit that skipped the hook (e.g. a hanging kernel) is still caught in CI for the Rust-checkable layer.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # claim-ancestry + audit-history derive verdicts from history; a shallow clone cannot (issue229)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --release
      - name: keel gates (kernel-free backstop — SKIP_VALIDATE can't bypass CI)
        run: |
          ./target/release/keel validate .
          ./target/release/keel guard
          ./target/release/keel check-engine .
          ./target/release/keel rules --enforce
      # Layer 3, hook-independent (K15/D0179): re-derive every pushed commit's verdict from the
      # tree alone — the issue116 control, now remote. No hook having run is assumed.
      - name: keel audit-history (tree-derived verdicts over the pushed range)
        run: ./target/release/keel audit-history --since "${{ github.event.before || 'HEAD~1' }}" || ./target/release/keel audit-history --max 20
      # Layer 4 (issue264/D0231): gate a FOREIGN tree. Measured over this project's own defect
      # record, 39 of 51 guards read only the authored model and ZERO read another project's tree,
      # while 11 of the last 20 issues were found in the field at exactly that boundary. This is the
      # manual act that found five of them, run every push instead of when someone remembers.
      # A GATE: a unit that cannot land in a project which lacks it is not transferable.
      - name: keel adoption-check (a unit must land in a project that lacks it)
        run: ./target/release/keel adoption-check .
      - name: keel audit-adherence (guard-set monotonicity — a control cannot be disarmed unsigned, D0209)
        # A GATE, not a report: unlike audit-history this fails the build. Re-derives from the tree,
        # on infra the agent cannot touch, that no rule severity weakened / guard vanished across the
        # pushed range without a co-committed signed Decision (the issue236 self-modification class).
        run: ./target/release/keel audit-adherence --since "${{ github.event.before || 'HEAD~50' }}"
