# Release pipeline (releaseWorkflow, D0093 deployment-readiness): on a `v*` tag, build the `keel`
# binary natively on each OS (linux x86_64, macOS arm64, windows x86_64) and attach the binaries to a
# GitHub Release, so downstream users get a prebuilt `keel` with NO Rust toolchain (D0093 spin-up).
# The tag is the trigger (releaseTag010, human-signed); this workflow does the build + publish.
# The build commands mirror the proven ci.yml gate (cargo --release). Rust-only; no conda/kernel.
#
# Every asset ships with its SHA-256 (D0385/issue417): the job that BUILT the binary hashes it and
# attaches `<asset>.sha256` beside it, and the `checksums` job then downloads the published binaries,
# verifies them against one `SHA256SUMS` and attaches that too - so the run itself is the first
# consumer of the checksum, and a stale or partial upload fails here rather than at a downstream
# clone. keelw and keel-wrapper.toml verify against these; before this the wrapper's entries were
# hashes of the download they were meant to verify. Guard `release-checksums-published` holds this.
name: release
on:
  push:
    tags: ['v*']
  # manual smoke (build-only; no tag context => the publish step is skipped, see its `if`)
  workflow_dispatch:

permissions:
  contents: write # required to create/update the GitHub Release

jobs:
  # issue211/D0191-family: the publish gate. A tag on a red or ungated commit used to build and
  # PUBLISH anyway - the engine's most outward-facing write was the only one with no gate of its
  # own. Same surfaces as ci.yml (clippy + tests + validate + guards) over the TAGGED commit; the
  # build/publish matrix requires it, so a red tag builds nothing and ships nothing.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # claim-ancestry + audit-history derive verdicts from history; a shallow
                          # clone cannot (issue229). ci.yml got this fix; THIS workflow did not, so
                          # the release gate had been red since guard 48 landed - undetected because
                          # releases are rare (issue260). Guard 51 now checks every gating workflow.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        # The federation suite's live-upstream claim calls `gh api` against this repository, and gh
        # REFUSES inside Actions without a token - so without this the release gate fails on a test
        # that passes everywhere else, and it fails only at release time, which is why it survived
        # (issue385, the issue260 class one workflow over). CI already supplies the same token.
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo test --workspace --release
      - name: keel gate (validate + guards)
        run: |
          cargo build --release --bin keel
          ./target/release/keel gate validate .
          ./target/release/keel gate guard

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: keel-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: keel-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: keel-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build keel (release)
        run: cargo build --release --target ${{ matrix.target }} --bin keel
      - name: stage binary (unix)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/keel" "${{ matrix.artifact }}"
      - name: stage binary (windows)
        if: runner.os == 'Windows'
        run: copy "target\${{ matrix.target }}\release\keel.exe" "${{ matrix.artifact }}"
      # The hash is computed HERE, by the job that built the bytes, in sha256sum format
      # ("<hex>  <name>") so `sha256sum -c` and `shasum -a 256 -c` read it unchanged.
      - name: checksum (unix)
        if: runner.os != 'Windows'
        run: (sha256sum "${{ matrix.artifact }}" 2>/dev/null || shasum -a 256 "${{ matrix.artifact }}") > "${{ matrix.artifact }}.sha256"
      - name: checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("${{ matrix.artifact }}.sha256", "$hash  ${{ matrix.artifact }}`n")
      - name: attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          generate_release_notes: true

  # One SHA256SUMS over every asset, VERIFIED against the published binaries before it is attached:
  # the release run is the checksum's first consumer (D0385). A binary whose published bytes differ
  # from the bytes its build job hashed fails this job, and the release is then not complete.
  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: aggregate and verify
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --pattern 'keel-*' --dir assets
          cd assets
          cat *.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
