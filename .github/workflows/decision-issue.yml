# decision-issue (D0205 githubChannel): a proposed Decision landing on main becomes a GitHub Issue
# the human can decide from their phone. The issue body is the decision's OWN deciding context
# (keel decision-card - one parser, never a second extraction that can drift), the title leads with
# the short name (D0203), and the label set is exactly the board filter (D0204: blockers only).
name: decision-issue
on:
  push:
    branches: [main]
    paths: ['.engine/decisions/*.sysml']
  workflow_dispatch: {}

permissions: {}

jobs:
  open-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # D0207: non-fork decisions auto-accept and commit at issue creation
      issues: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0   # the in-workflow gate includes history-derived guards
      # Build here, download the PINNED release downstream (D0281, issue326). This unit ships to
      # projects that have no keel-cli crate; `cargo build` there failed at startup and every consumer
      # inherited two permanently red workflows. Downloading `latest` would be wrong too: the project's
      # pin is BINDING and validate/guard REFUSE under skew (D0251), so the runner must run the version
      # the project declared. One file, correct in both homes.
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('keel-cli/Cargo.toml') != ''
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        if: hashFiles('keel-cli/Cargo.toml') != ''
      - name: install keel (build in the engine repo, pinned release everywhere else)
        run: |
          set -euo pipefail
          if [ -f keel-cli/Cargo.toml ]; then
            cargo build --release -p keel-cli --bin keel
          else
            PIN=$(sed -nE 's/^engine *= *"([^"]+)".*/\1/p' .engine/contracts/engine-version.toml)
            [ -n "$PIN" ] || { echo "::error::no engine pin in .engine/contracts/engine-version.toml"; exit 1; }
            mkdir -p target/release
            curl -fsSL -o target/release/keel "https://github.com/williamweatherholtz/sysmlv2-ai-toolkit/releases/download/v${PIN}/keel-linux-x86_64"
            chmod +x target/release/keel
          fi
          ./target/release/keel version
      - name: open an issue per proposed decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create blocks-work --force --color B60205 --description "a decision gating work - your call" || true
          gh label create decision --force --color 4C5FD7 --description "keel decision issue (D0205)" || true
          ./target/release/keel decision-card --proposed > cards.json
          python3 .github/scripts/open_decision_issues.py
      - name: auto-accept non-forks under standing consent (D0207)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f auto_queue.txt ] || { echo "nothing to auto-accept"; exit 0; }
          while IFS=$'	' read -r name number url; do
            AUTO_DECISION="$name" ISSUE_NUMBER="$number" ISSUE_URL="$url" bash .github/scripts/record_decision.sh
          done < auto_queue.txt
