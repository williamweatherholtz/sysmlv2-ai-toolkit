reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "conformanceIndicator (keel show indicators)"
knownFailureModes = "a rejection may be the pilot kernel's gap rather than ours, which is why it is an indicator and never a gate (D0132/issue081)"
