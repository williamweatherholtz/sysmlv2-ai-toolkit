# ---- The JVM kernel lane: found by guard 65 on its first run, not by me ----------------------
# All five ask the SysML v2 pilot kernel a question, so their determinism is EXTERNAL: the answer can
# change when the kernel does, with no change here. Two of them BLOCK, which makes them controls as
# well as instruments - a thing this inventory should say out loud rather than let a reader infer.

[validateSchema]
path = ".engine/tools/validate/validate_schema.py"
kind = "instrument+control"
measures = "whether the schema packages parse and type-check against the pilot kernel"
output = "verdict"
reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "it BLOCKS a schema change (CLAUDE.md section 5)"
knownFailureModes = "an external verdict can flip without a change here; the kernel's own gaps are indistinguishable from ours (D0132/issue081)"
assessed = "no"

[validateWorkflows]
path = ".engine/tools/validate/validate_workflows.py"
kind = "instrument+control"
measures = "whether the process-as-data workflow files parse and type-check against the pilot kernel"
output = "verdict"
reportsTo = "agent"
sensedFrom = "enforcement-surface"
determinism = "external"
publishedTo = "it BLOCKS a workflow change"
knownFailureModes = "as validateSchema"
assessed = "no"

[validateInstances]
path = ".engine/tools/validate/validate_instances.py"
kind = "instrument"
measures = "whether each instance file types against the flat schema in the kernel"
output = "verdict"
reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "opt-in only (KEEL_KERNEL_VALIDATE=1)"
knownFailureModes = "DEMOTED because it fails CORRECT files, which forced an all-or-nothing bypass that disabled every other layer (D0132/issue081) - the sharpest instance of an instrument's false verdict costing more than its true ones"
assessed = "no"

[validateTracking]
path = ".engine/tools/validate/validate_tracking.py"
kind = "instrument"
measures = "whether tracking instances type against the full schema in the kernel"
output = "verdict"
reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "the kernel lane"
knownFailureModes = "as validateInstances"
assessed = "no"

[validateProbes]
path = ".engine/tools/validate/validate_probes.py"
kind = "instrument"
measures = "which exact SysML v2 patterns the kernel accepts, cell by cell"
output = "verdict"
reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "schema design decisions"
knownFailureModes = "a cell FAILS iff the kernel emits a line containing ERROR, which is a text match on another program's output"
assessed = "no"

[importProbe]
path = ".engine/tools/validate/import_probe.py"
kind = "instrument"
measures = "whether the kernel resolves imports the way the schema assumes"
output = "verdict"
reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "schema design decisions"
knownFailureModes = "as validateProbes"
assessed = "no"

[structureProbe]
path = ".engine/tools/validate/structure_probe.py"
kind = "instrument"
measures = "whether the kernel accepts the structural constructs the schema relies on"
output = "verdict"
reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "schema design decisions"
knownFailureModes = "as validateProbes"
assessed = "no"

[spikeMetamodel]
path = ".engine/tools/validate/spike_metamodel.py"
kind = "instrument"
measures = "whether SysML v2 can express the process-as-data meta-model at all"
output = "verdict"
reportsTo = "agent"
sensedFrom = "model"
determinism = "external"
publishedTo = "a foundation decision, when it was run"
knownFailureModes = "a one-off measurement whose answer is still cited; nothing re-runs it, so it is a claim about a kernel version nobody records"
assessed = "no"

# ---- NOT instruments: recorded so the boundary is arguable rather than implied ----
[notInstruments]
capture_user = "captures a human's words verbatim — a write path, not a measure"
deck_inbox_record = "records a tap from the deck — a write path"
test_deck_e2e = "a test, not a standing measure"
kill_stale_kernels = "cleanup"
_kernel = "kernel lifecycle helper"
validate_all = "runs the JVM validators; its VERDICT is the instrument and it is the opt-in kernel lane (D0132), reported through keel"
