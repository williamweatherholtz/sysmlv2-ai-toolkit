sensedFrom = "enforcement-surface"
determinism = "tree"
publishedTo = "D0360's evidence, pending dcControlProofStateIsComputed moving it into the binary"
knownFailureModes = "its own first version returned a false 64/64 by matching its own registry; textual, so a guard exercised by a fixture that never names it counts as unnamed"
assessed = "no"

[conformanceLane]
