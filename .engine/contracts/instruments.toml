# INSTRUMENTS — the measures this project acts on that are NOT CLI commands (D0361, st-instruments).
#
# WHY THIS FILE EXISTS. The safety viewpoint computes the feedback half of this project's control
# structure from `CliCommand` facts (D0271: effect=reads -> feedback) and CI workflow statuses — 77
# channels, all derived, none authored. Measured 2026-09-06: NOT ONE of the instruments declared below
# appears in that computed structure - and eight of them were found by guard 65 rather than by the
# author of this file, whose hand-written inventory was short by a third on its first pass. `keel show control-structure` cannot see them, so
# `stpa-self` could never analyse them and `stpa-currency` could never notice them missing — which is
# why six defects in one day (issue384, issue386, issue389, issue390, issue391, issue392) all landed in
# instruments and none was caught by the analysis that exists to catch exactly this.
#
# WHAT IS AND IS NOT IN HERE. Only the NON-DERIVABLE ones. The CLI channels stay computed and are
# cited, never copied (D0105: one home per fact). A tool that transforms, captures or cleans up is not
# an instrument: an instrument produces a NUMBER, a VERDICT or a FIGURE that this project publishes or
# acts on. The classification is recorded per entry so the boundary is arguable rather than implied.
#
# `determinism` IS THE FIELD THAT WAS MISSING. A deterministic instrument re-run on the same tree gives
# the same answer, so one run is a measurement. A stochastic one does not, and a single run of it reads
# exactly like a single run of the other — which is how a routing number that flips on two of four
# cases nearly got published as coverage (issue392). Values: `tree` (a function of the tree), `seeded`
# (random but pinned), `stochastic` (a model in the loop — a single run is NOT a measurement),
# `external` (an outside party answers; the answer can change under you).
#
 `sensedFrom` is the CONTROLLED PROCESS the instrument observes, and `reportsTo` the controller whose
# belief it maintains. Both ends are needed because a control structure is composed of LOOPS: with only
# one end declared, an instrument can be inventoried and still not appear as a feedback path, which is
# how twelve declared instruments remained invisible to `keel show control-structure` for a day after
# being written down. Roles are the view's own: model, main-ref, enforcement-surface, deliverable,
# work, agent-turn.
#
# `assessed` tracks the propriety state (D0361): `no` until a round covers it under the five lenses.
# Silence is a gap, never a clean bill.

[recallBench]
path = ".engine/tools/recall_bench.py"
kind = "instrument"
measures = "whether ranked recall beats a keyword search at putting the answering record in front of the model"
output = "number"
reportsTo = "agent"
sensedFrom = "model"
determinism = "seeded"
publishedTo = "a DoD criterion, and the standing brief when retrieval is the subject"
knownFailureModes = "issue296 (a query built from the target's own body scores ~100% and discriminates nothing); issue391 (an element that answers the question is scored a miss because ground truth names one record)"
assessed = "no"

[recallAb]
path = ".engine/tools/recall_ab.py"
kind = "instrument"
measures = "whether injection puts the answering element in front of the model on eight hand-written questions"
output = "number"
reportsTo = "agent"
sensedFrom = "model"
determinism = "tree"
publishedTo = "a DoD criterion"
knownFailureModes = "issue391 (the hit definition); the set is small enough that one case moves the number by 12 points"
assessed = "no"

[routingProbe]
path = ".engine/tools/routing_probe.py"
