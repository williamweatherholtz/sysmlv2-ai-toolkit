reportsTo = "agent"
sensedFrom = "enforcement-surface"
determinism = "stochastic"
publishedTo = "an indicator, once issue392 settles what shape is bought"
knownFailureModes = "issue392 (two of four verdicts flipped between identical runs, so one sample per skill is not a measurement)"
assessed = "no"

[guardProofCensus]
path = ".engine/tools/guard_proof_census.py"
