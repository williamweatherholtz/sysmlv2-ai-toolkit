# process-enforcement — is each process's constraint MACHINE-CHECKABLE, and if not, why not?
#
# issue173/D0169. `keel activation` reported "asserts no guard — nothing to switch off" for 13 of 24
# processes, and nothing distinguished the two very different reasons that can be true:
#
#   (a) the constraint IS checkable and no guard was written  — a real gap, and the thing to fix;
#   (b) the constraint is a HUMAN JUDGMENT and no guard can exist — correct, and permanent.
#
# Both printed identically, so 68% of the catalogue looked like debt when much of it is not. This file
# records the distinction. `keel show hardening` reads it and reports three buckets instead of two: enforced,
# declared-unenforceable (with the reason), and UNDECLARED — the last being the honest gap.
#
# THIS IS AN INDICATOR, NEVER A GATE (invariant 7). A guard cannot be conjured for a judgment, so gating
# on the ratio would be Goodhart: the cheapest way to make it green is to write a guard that checks
# nothing. An entry here is a claim a reviewer can disagree with, which is the point.
#
# A process with NO entry is UNDECLARED — deliberately, so silence reads as a gap rather than as consent
# (D0138: a project that never adopted a control has not violated it, and the converse holds here).
#
# REMOVAL PATH (D0163): delete this file. `keel show hardening` falls back to reporting every unguarded
# process as undeclared, which is the pre-issue173 behaviour and is strictly less informative.

[dod]
checkable = false
reason = "A definition of DONE is the judgment 'is this work actually finished'. The engine already gates the checkable half — a phase's gate is its verify-linked Tests passing (invariant 6), and `ceremony` enforces that the gates exist and are ordered. What is left over is irreducibly a judgment, and a guard asserting otherwise would launder it."

[dor]
checkable = false
reason = "Same shape as `dod`: readiness is a judgment about whether a thing is understood well enough to start. `ceremony` already enforces that a refine gate EXISTS and precedes the rest; whether its content was honest cannot be read off text."

[critique]
checkable = false
reason = "An antagonistic critique is a judgment by construction — D0046's whole design is that a human or AI tries to BREAK a claim. `element-critique` asserts one guard over critique COVERAGE (did a required lens get applied), which is the checkable part; whether the critique was any good is not."

[intake]
checkable = false
reason = "Whether a Statement was recorded verbatim, and whether the UserStory faithfully translates it, are both judgments about fidelity to something outside the model. `keel show intake` reports the computable gaps instead — unparsed, unrouted, unsourced — and the intake process's own audit step reads those numbers back. A guard could only check that fields are non-empty, which would make the practice look enforced while enforcing nothing."

[indicatorMonitoring]
checkable = false
reason = "The process is 'watch a number and interpret it'. Interpretation is the deliverable. Gating an indicator is precisely what invariant 7 forbids, so a guard here would contradict the schema layer it belongs to."

[introduction]
checkable = false
reason = "Onboarding a reader into the engine. Its output is a person's understanding, which leaves no artifact to check."

[knowledgeGraphMemory]
checkable = false
reason = "Traversal and recall of the model as a graph. Whether the right thing was recalled is a judgment about relevance; D0161's retrieval index is the artifact, and its EXISTENCE is now checked by decision-artifacts.toml rather than by a process guard."

[migration]
checkable = true
reason = "UNDER-GUARDED. D0067's gated expand/migrate/contract with a committed transform and a dry run reconciling control totals is a sequence of artifacts, all of which exist or do not. `marker-census` computes exactly the control total the process requires and is not bound to it."

[diagramView]
checkable = false
reason = "Rendering a graph for a human to look at. The `viewpoint-renderer` guard already checks that a declared viewpoint HAS a renderer, which is the checkable claim; whether the picture communicates anything is not."

[reportView]
checkable = false
reason = "Same as `diagramView`: computing and presenting a scorecard. `render` asserts the renderer guard. Whether a reader acted on the report is outside the model — and if it were inside, it would be an obligation, which the console already tracks."

[adversarialPanelReview]
checkable = false
reason = "A critique round is a judgment by construction, same shape as [critique]: whether a panelist's finding is real, whether a resolution is substantive rather than a renaming, and whether unanimity was uncompelled are all judgments about argument quality that no text predicate can read. The checkable residue is tiny and indirect (the recorded outputs - Decisions, Issues, tasks - are gated like any other facts). A guard could only count findings, which would make rigor look enforced while enforcing nothing."

[businessElicitation]
checkable = false
reason = "The value is in what gets ASKED and whether the answer was recorded before it was interpreted, and neither is readable from text. A guard could check that a Need carries a #DerivedFrom edge to a UserStory - and that check is worth having - but it belongs to the requirement layer, not here, and passing it says nothing about whether the elicited need is the stakeholder's real one or a paraphrase that survived because nobody contested it. The one thing a predicate CAN see is the ordering claim (Statement before Need), and even that is only visible when both exist: an elicitation that produced no Statement at all looks identical to a conversation that never happened. Declared unenforceable rather than given a guard that would make the practice look enforced while enforcing nothing (the [intake] reasoning, applied to the active case)."

[decisionAuthoring]
# D0223, human-directed: these five enforce Decision authoring and are CORE - no unit claims them,
# so `keel deactivate` cannot reach them and every adopting project gets them enforced with no
# activation step. They were switchable until 2026-08-24, which meant `keel deactivate
# decision-authoring` also switched off `confirmation-authenticity` - the guard that stops an AI
# recording a human acceptance THAT NEVER HAPPENED. That is the monitor-modifiable-by-monitored gap
# (issue236/D0208) sitting on the most attestation-sensitive path in the engine, and §4 says a
# fabricated human judgment must never be possible.
#
# Declared here rather than left silent because a core-enforced process otherwise reports `guards: 0`
# and falls into UNDECLARED - reading as "not enforced" when the truth is "enforced unconditionally".
# The process -> guard link still has to be recorded; it just is not an activation claim any more.
core = ["decision-rationale", "acceptance-events", "decision-requirement-link", "attestation-substance", "confirmation-authenticity"]

# issue305 (D0255) — a DoD claiming it resolves an Issue "in part" while a #Resolves edge closes it
# outright. DECLARED UNENFORCEABLE, with the reason, rather than left silent or gated badly.
#
# A wording gate WAS attempted and is not shipped. It flagged .tracking/backlog.sysml on its first run
# against the real corpus - a false positive - and its design was wrong twice: file-scoped, while the
# #Resolves edges and the DoD prose live in DIFFERENT files, and matching "in part." catches innocent
# sentences. D0232 already records three attempts to gate verdict WORDING at 111, 35 and 1 false
# positives, with the conclusion that language policing does not calibrate here. This was the fourth,
# and it calibrated no better.
#
# There is no structural signal: pointing a #Resolves edge at a story that only partly addresses the
# Issue produces a model identical to one where the story fully addresses it. The distinction lives
# entirely in the author's intent.
#
# WHAT ACTUALLY CAUGHT IT, and the only thing that will: reading the computed view back after writing.
# `keel show open-issues` said CLOSED while the sprint's own closeOut gate said OPEN, and the disagreement
# was visible the moment both were read together. That is the verify-don't-assert discipline doing the
# work a guard cannot.
[issue305PartialResolution]
checkable = false
reason = "No structural signal exists - a partly-addressing resolver is indistinguishable in the model from a fully-addressing one. A wording gate was attempted, produced a false positive on first contact with the corpus, and was removed rather than tuned (D0232: language policing does not calibrate here, now four times). Caught instead by reading the computed view back after the write."
