# Unit EXTRAS (D0219) — the files a process unit needs to RUN that are not its definition, its
# deploying skill, or a declared rule.
#
# WHY THIS FILE EXISTS. srPortModularProcessUnit is an accepted `must`: a unit carries enough "to be
# moved between projects whole, without carrying the rest of the engine and WITHOUT LEAVING ITS
# ENFORCEMENT BEHIND". `keel process export decision-channel` produced three files — the process
# definition, the skill, and unit.toml — while the five files that ARE the channel (two GitHub
# workflows, two scripts, and the actor/decider table) stayed home. The guard travelled BY NAME and
# the machinery travelled not at all, so adopting the channel meant hand-copying and re-deriving,
# which is exactly how process knowledge leaks out of the engine (D0040).
#
# This is the same class as issue241 (the catalogue denied 12 processes that existed) and issue245
# (the elicitation skill was in no catalogue): a unit whose teeth stay behind.
#
# Paths are repo-relative and travel VERBATIM. A declared path is REQUIRED in every project that
# installs the unit (D0300, issue290): `keel guard unit-extras-present` fails when one is absent, because
# a definition and a skill referencing machinery that is not there is exactly how penumbra received the
# channel - four mechanism files hand-staged out of the PR, nothing catching it. Declare only what the
# unit actually carries; an optional file is not a mechanism.
#
# INSTANCE DATA IS NOT AN EXTRA. `.engine/contracts/github-actors.toml` names WHO MAY DECIDE on a
# specific project, and shipping this project's deciders into another one is precisely the defect
# D0219 exists to fix. The importing project declares its own; an unmapped login is refused rather
# than defaulted (issue182).
#
# ADOPT WITH `keel process import <unit>`, never by staging files by hand: the importer places every
# carried file and records the install; hand-staging is what dropped four (issue290).
#
# No installed unit declares extras today: the decision-channel unit, the only one that did, left at
# D0292. A unit that gains a mechanism declares it here as:
#
#   [<unit>]
#   files = [".github/workflows/<unit>.yml", ".github/scripts/<unit>.py"]
#   requires = ["what the adopter must supply themselves, in words"]
