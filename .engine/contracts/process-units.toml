# =====================================================================
# Process units (D0138) — what each PROCESS brings with it. This is an ENGINE FACT, not a project
# choice: the project declares which processes it has ACTIVATED in `.engine/contracts/activation.toml`,
# and this file says what activating one turns on. Two files because they are two different kinds of
# claim; conflating them would make the engine's own structure editable as project config.
#
# Follows the D0097 `critique-policy.toml` precedent: declared TOML read at runtime, never a baked-in
# map, so a downstream project can inspect exactly what it has adopted.
#
# WHY A UNIT AND NOT JUST A SKILL (D0059): a process is only real if its enforcement travels with it.
# Adding a skill without its guards gives you a procedure nobody checks; adding guards without the skill
# gives you enforcement nobody can follow. Activating a unit does both in one step.
#
# SEMANTICS:
#   - `guards` listed here are PROCESS-BOUND: enforced only while that process is active. When it is
#     inactive they are SKIPPED AND REPORTED — never silently dropped (the issue090 lesson: a project
#     that never adopted a control has not violated it, but it must still be able to SEE that it has
#     not adopted it).
#   - A guard named in NO unit is CORE: always enforced, not deactivatable. See the core list below.
#   - `rules` are the declared `.engine/rules/` rules the process brings. A rule-sourced guard checks
#     its rule only when present; activation makes the ADOPTION explicit instead of inferred from the
#     file existing (which is what issues 089/090 were both really about).
#   - `skills` are the skills that DEPLOY the process. Informational here; `guard process-skill` is the
#     control that a process has one.
#   - An unknown process name or an unknown guard name in EITHER file is a FAIL-LOUD error
#     (`guard activation-manifest`), exactly as an unknown critique lens is under D0097.
#
# CORE GUARDS — deliberately absent from every unit, so no activation choice can switch them off:
#   actors, charter, requirement-rootedness, marker-vocabulary, duplicate-identity, engine-lint,
#   manifest-coverage, process-skill, process-change, hook-config-integrity
# These protect the INTEGRITY OF THE MODEL ITSELF (identity, provenance, vocabulary, rootedness,
# well-formedness) rather than any one way of working, and they are the checks whose absence would let a
# project corrupt its own record silently. Making them deactivatable would turn this manifest into the
# all-or-nothing bypass that issue081 cost eight commits to learn about: the point of activation is to
# stop enforcing procedures a project has not adopted, NOT to make truthfulness optional.
# =====================================================================

[units.agile-workflow]
skills = ["sprint-planning", "sprint-standup", "sprint-review", "sprint-closeout", "sprint-retro", "backlog-refinement"]
rules = []
guards = ["ceremony", "sprint-coverage", "retro-backlog", "priority-inversion", "verification-trace"]

[units.decision-authoring]
skills = ["decision-authoring"]
rules = ["decisionRationaleRule", "acceptanceEventRule", "decisionNoVerdictProseRule", "confirmationAuthenticityRule"]
guards = ["decision-rationale", "acceptance-events", "decision-requirement-link", "attestation-substance", "confirmation-authenticity"]

[units.issue-resolution]
skills = ["issue-resolution"]
rules = ["issuesTriagedRule"]
guards = ["issues"]

[units.element-critique]
skills = ["element-critique", "architectural-critique"]
rules = []
guards = ["critic-independence"]

[units.render]
skills = ["render", "view", "diagram"]
rules = []
guards = ["viewpoint-renderer"]

[units.doc-sync]
skills = ["doc-sync"]
rules = []
guards = ["doc-sync"]
